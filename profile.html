<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Profile | Welcue</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="profile-page">

  <div class="container">
    <div class="card profile-card">

      <h2>Build Your Profile</h2>
      <p class="subtitle">Let recruiters understand your strengths</p>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label>Major / Branch</label>
        <input type="text" placeholder="Computer Science, Mechanical, etc.">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>GPA</label>
          <input type="number" step="0.01" placeholder="8.5">
        </div>

        <div class="form-group">
          <label>Graduation Year</label>
          <input type="number" placeholder="2026">
        </div>
      </div>

      <div class="form-group">
        <label>Technical Skills</label>
        <textarea placeholder="Java, Python, SQL, React..."></textarea>
      </div>

      <div class="form-group">
        <label>Projects / Experience</label>
        <textarea placeholder="Describe key projects or internships"></textarea>
      </div>

      <div class="form-group">
        <label>Upload Resume</label>
        <input type="file">
      </div>

      <button class="btn">Save Profile</button>

    </div>
  </div>
</body>
</html>
